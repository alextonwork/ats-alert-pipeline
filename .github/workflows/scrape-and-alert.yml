name: Scrape ATS boards and alert

on:
  # GitHub's own `schedule` trigger is documented as best-effort, not
  # guaranteed -- in practice it fired erratically (1.7-5 hour gaps
  # instead of every 20 min). repository_dispatch lets an external cron
  # service (cron-job.org) hit GitHub's API on a real, reliable clock.
  # Keeping `schedule` too as a redundant fallback in case the external
  # pinger itself ever goes down.
  repository_dispatch:
    types: [external-cron-tick]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

# Prevent overlapping runs from racing on the same state files
concurrency:
  group: scrape-and-alert
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scrape
        working-directory: scripts
        run: python scrape.py

      - name: Filter and alert
        working-directory: scripts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python filter_and_alert.py

      - name: Commit updated state
        run: |
          git config user.name "ats-alert-bot"
          git config user.email "actions@github.com"
          git add data/latest_jobs.json data/seen_jobs.json data/volume_baseline.json data/companies.json
          git diff --cached --quiet || git commit -m "chore: update job state [skip ci]"
          git pull --rebase --autostash
          git push
